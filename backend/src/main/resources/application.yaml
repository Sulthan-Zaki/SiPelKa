spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: SiPelKa
  datasource:
    url: jdbc:postgresql://localhost:5433/sipelka_db
    username: sipelka_user
    password: sipelka_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': true

app:
  jwt:
    secret: "SiPelKaJwtSecretKeyYangSangatPanjangDanAman2026XYZ!!SuperSecureKeyForHS256Algorithm!!MustBeAtLeast256BitsLongForHS256"
    expiration-ms: 86400000 # 24 hours
  admin-token: "SIPELKA_ADMIN_SECRET_2026"
  seed-data: ${APP_SEED_DATA:false}

