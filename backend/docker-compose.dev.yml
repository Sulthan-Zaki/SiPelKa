services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sipelka_backend_dev
    ports:
      - "8080:8080"
      - "5005:5005" # Exposed for remote debugging
    volumes:
      # Mount the source code into the container so changes are reflected automatically
      - ./src:/app/src
      # Mount the uploads folder so that uploaded photos and PDFs persist
      - ./uploads:/app/uploads
    environment:
      # Override the local datasource to connect to the docker network's postgres container
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sipelka_db
      - SPRING_DATASOURCE_USERNAME=sipelka_user
      - SPRING_DATASOURCE_PASSWORD=sipelka_secret
      - APP_SEED_DATA=true
    depends_on:
      - postgres

  postgres:
    image: 'postgres:18-alpine'
    container_name: sipelka_postgres_dev
    environment:
      - 'POSTGRES_DB=sipelka_db'
      - 'POSTGRES_USER=sipelka_user'
      - 'POSTGRES_PASSWORD=sipelka_secret'
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
