spring:
  application:
    name: SiPelKa
  datasource:
    url: jdbc:postgresql://localhost:5432/sipelka_db
    username: sipelka_user
    password: sipelka_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
